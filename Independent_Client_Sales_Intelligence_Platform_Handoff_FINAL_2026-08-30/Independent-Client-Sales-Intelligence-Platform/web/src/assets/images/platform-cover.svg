<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sales intelligence background</title>
  <desc id="desc">Abstract blue background with a subtle data grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1260" cy="170" r="330" fill="#38bdf8" opacity=".13"/>
  <circle cx="180" cy="870" r="410" fill="#60a5fa" opacity=".12"/>
  <path d="M150 760 430 520l235 118 315-354 238 146 250-250" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".32" stroke-width="18"/>
